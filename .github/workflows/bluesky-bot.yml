name: Bluesky progress bot

on:
  schedule:
    # 08:13 UTC ≈ 10:13 AM in France (10:13 CEST / 09:13 CET) — cron doesn't
    # shift for daylight saving, so this drifts to 9:13 local in winter;
    # close enough for a "morning" post, adjust if it starts to bother you.
    # Minute 13 (not :00) on purpose — GitHub's own docs warn that
    # top-of-the-hour schedules see the most congestion and can be delayed
    # 5-30+ min (or skipped during an incident); an off minute avoids most
    # of that.
    - cron: '13 8 * * *'
  # Lets you trigger a run manually from the Actions tab (e.g. right after
  # editing the script) without waiting for the schedule.
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (log intended posts, do not actually post or write to Supabase)'
        type: boolean
        default: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run bot
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          BLUESKY_IDENTIFIER: ${{ secrets.BLUESKY_IDENTIFIER }}
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            node scripts/bluesky-bot/post-updates.mjs --dry-run
          else
            node scripts/bluesky-bot/post-updates.mjs
          fi
