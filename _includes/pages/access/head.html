<style>
        .access-prose { max-width: 760px; margin: 0 auto; }
        .access-prose p { font-size: 1rem; line-height: 1.75; color: #495057; margin-bottom: 18px; }
        .access-prose-intro p { text-align: center; }

        .access-section { max-width: 820px; margin: 0 auto; }
        .access-section + .access-section { margin-top: 70px; padding-top: 60px; border-top: 1px solid #e9ecef; }

        .access-kicker {
            display: inline-flex; align-items: center; gap: 6px;
            font-size: 0.72rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em;
            color: #7248b8; background: #ece5f7; border-radius: 999px; padding: 4px 12px;
            margin-bottom: 14px;
        }
        .access-section h2 { font-size: 1.5rem; color: #2c3e50; margin-bottom: 12px; }
        .access-section .access-lede { font-size: 1rem; line-height: 1.75; color: #495057; margin-bottom: 28px; max-width: 640px; }

        /* Which-one triage cards */
        .triage-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px; margin: 36px 0 0; }
        .triage-card { background: #fff; border: 1px solid #e9ecef; border-radius: 10px; padding: 24px; }
        .triage-card h3 { font-size: 1rem; color: #2c3e50; margin-bottom: 6px; }
        .triage-card p { font-size: 0.88rem; line-height: 1.6; color: #6c757d; margin-bottom: 12px; }
        .triage-card a { font-size: 0.85rem; font-weight: 600; color: #34495e; text-decoration: none; }
        .triage-card a:hover { text-decoration: underline; }

        /* Numbered setup steps */
        .setup-steps { margin-top: 30px; }
        .setup-step { display: flex; gap: 18px; margin-bottom: 26px; }
        .setup-step-num {
            flex: none; width: 30px; height: 30px; border-radius: 50%;
            background: #2c3e50; color: #fff; font-size: 0.85rem; font-weight: 600;
            display: flex; align-items: center; justify-content: center;
        }
        .setup-step-body h3 { font-size: 1rem; color: #2c3e50; margin-bottom: 6px; }
        .setup-step-body p { font-size: 0.92rem; line-height: 1.65; color: #495057; margin-bottom: 10px; }
        .setup-step-body .citation-box { margin: 8px 0 0; max-width: none; padding: 14px 18px; }
        .setup-step-body .citation-box pre { font-size: 0.82rem; white-space: pre-wrap; }

        /* "What you can ask" list */
        .capability-list { list-style: none; margin: 24px 0 0; padding: 0; }
        .capability-list li {
            display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap;
            padding: 12px 0; border-bottom: 1px solid #f1f3f5; font-size: 0.92rem; color: #495057;
        }
        .capability-list li:last-child { border-bottom: none; }
        .capability-tool {
            font-family: 'Courier New', monospace; font-size: 0.72rem; color: #7248b8;
            background: #f7f5fb; border-radius: 4px; padding: 2px 7px; white-space: nowrap;
        }

        /* Chat demo */
        .chat-demo { max-width: 640px; margin: 30px auto 0; }
        .chat-demo-caption { text-align: center; font-size: 0.82rem; color: #868e96; margin-bottom: 18px; }
        .chat-turn { margin-bottom: 22px; }
        .chat-bubble {
            border-radius: 14px; padding: 14px 18px; font-size: 0.92rem; line-height: 1.6;
            max-width: 88%;
        }
        .chat-bubble--user {
            background: #2c3e50; color: #fff; margin-left: auto; border-bottom-right-radius: 4px;
        }
        .chat-bubble--claude {
            background: #fff; color: #495057; border: 1px solid #e9ecef; margin-right: auto;
            border-bottom-left-radius: 4px;
        }
        .chat-bubble--claude p { margin: 0 0 10px; }
        .chat-bubble--claude p:last-child { margin-bottom: 0; }
        .chat-bubble--claude strong { color: #2c3e50; }
        .chat-tool-row { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
        .chat-tool-chip {
            font-family: 'Courier New', monospace; font-size: 0.68rem; color: #7248b8;
            background: #ece5f7; border-radius: 999px; padding: 3px 10px;
        }

        /* Quality callout */
        .quality-callout {
            max-width: 640px; margin: 32px auto 0; background: #fff8ec; border: 1px solid #f3e1b8;
            border-radius: 10px; padding: 20px 24px; font-size: 0.88rem; line-height: 1.65; color: #6b5a2c;
        }
        .quality-callout strong { color: #4a3d1a; }

        .access-footlink { text-align: center; margin-top: 30px; }
        .access-footlink a { font-size: 0.88rem; font-weight: 600; color: #34495e; text-decoration: none; }
        .access-footlink a:hover { text-decoration: underline; }
    </style>
